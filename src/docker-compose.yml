services:
  db-rateukma:
    image: postgres:15
    container_name: "${COMPOSE_PROJECT_NAME}_postgres"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - dev
      - prod
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.4-alpine
    container_name: "${COMPOSE_PROJECT_NAME}_redis"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    profiles:
      - dev
      - prod
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lfu


  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME}_django_backend"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - STATIC_ROOT=/static
      - MEDIA_ROOT=/media
    volumes:
      - ./backend:/app
      - ${STATIC_ROOT}:/static
      - ${MEDIA_ROOT}:/media
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
      - frontend
    depends_on:
      - db-rateukma
      - redis
    profiles:
      - dev

  backend:
    image: ghcr.io/ukma-cs-ssdm-2025/rate-ukma/backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: "${COMPOSE_PROJECT_NAME}_django_backend_release"
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - backend
      - frontend
    depends_on:
      - db-rateukma
      - redis
    env_file:
      - .env
    environment:
      - STATIC_ROOT=/static
      - MEDIA_ROOT=/media
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-}
    volumes:
      - ${STATIC_ROOT}:/static
      - ${MEDIA_ROOT}:/media
    ports:
      - "127.0.0.1:8000:8000"
    profiles:
      - prod

  webapp-dev:
    build:
      context: ..
      dockerfile: ./src/webapp/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: "${COMPOSE_PROJECT_NAME}_webapp"
    restart: unless-stopped
    volumes:
      - ./webapp:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend
    env_file:
      - .env
    depends_on:
      - backend-dev
    profiles:
      - dev

  webapp-build:
    image: ghcr.io/ukma-cs-ssdm-2025/rate-ukma/webapp:${WEBAPP_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./src/webapp/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SENTRY_DSN_FRONTEND: ${VITE_SENTRY_DSN_FRONTEND}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT_FRONTEND: ${SENTRY_PROJECT_FRONTEND}
    env_file:
      - .env
    volumes:
      - ${STATIC_ROOT}:/static
    profiles:
      - prod

  parser-api:
    image: ghcr.io/ukma-cs-ssdm-2025/rate-ukma/parser:${PARSER_IMAGE_TAG:-latest}
    container_name: "${COMPOSE_PROJECT_NAME}_parser_api"
    restart: unless-stopped
    build:
      context: ./parser
      dockerfile: Dockerfile
    command: api
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://ukma_data:${UKMA_DATA_DB_PASSWORD}@db-rateukma:5432/ukma_data
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
    depends_on:
      parser-migrate:
        condition: service_completed_successfully
    profiles:
      - dev

  parser-db-init:
    image: postgres:15
    container_name: "${COMPOSE_PROJECT_NAME}_parser_db_init"
    command: psql -v ON_ERROR_STOP=1 -h db-rateukma -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /init-db.sql
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - UKMA_DATA_DB_PASSWORD=${UKMA_DATA_DB_PASSWORD}
    volumes:
      - ./parser/init-db.sql:/init-db.sql:ro
    networks:
      - backend
    depends_on:
      db-rateukma:
        condition: service_healthy
    profiles:
      - dev

  parser-migrate:
    image: ghcr.io/ukma-cs-ssdm-2025/rate-ukma/parser:${PARSER_IMAGE_TAG:-latest}
    container_name: "${COMPOSE_PROJECT_NAME}_parser_migrate"
    build:
      context: ./parser
      dockerfile: Dockerfile
    command: migrate
    environment:
      - DATABASE_URL=postgres://ukma_data:${UKMA_DATA_DB_PASSWORD}@db-rateukma:5432/ukma_data
    networks:
      - backend
    depends_on:
      parser-db-init:
        condition: service_completed_successfully
    profiles:
      - dev

  parser-worker:
    image: ghcr.io/ukma-cs-ssdm-2025/rate-ukma/parser:${PARSER_IMAGE_TAG:-latest}
    container_name: "${COMPOSE_PROJECT_NAME}_parser_worker"
    restart: unless-stopped
    build:
      context: ./parser
      dockerfile: Dockerfile
    command: worker
    environment:
      - DATABASE_URL=postgres://ukma_data:${UKMA_DATA_DB_PASSWORD}@db-rateukma:5432/ukma_data
      - CORPORATE_EMAIL=${CORPORATE_EMAIL}
      - CORPORATE_PASSWORD=${CORPORATE_PASSWORD}
    networks:
      - backend
    depends_on:
      parser-migrate:
        condition: service_completed_successfully
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:


networks:
  frontend:
    driver: bridge
    name: "${COMPOSE_PROJECT_NAME}_frontend"
  backend:
    driver: bridge
    name: "${COMPOSE_PROJECT_NAME}_backend"
