[pytest]
DJANGO_SETTINGS_MODULE = rateukma.settings.testing
python_files = test_*.py
addopts = --reuse-db --strict-markers --strict-config
filterwarnings =
    # Django 6 renames CheckConstraint.check to .condition; the models still use
    # the old kwarg (rating.py, course_offering.py, course_offering_term.py).
    ignore:.*CheckConstraint\.check is deprecated.*:DeprecationWarning
markers =
    e2e: mark test as end-to-end
    integration: mark test as integration
