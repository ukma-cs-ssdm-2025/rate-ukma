---
name: PR title

# Report only: a title that breaks the commit format is flagged, never blocks.
# PRs squash-merge, so the PR title becomes the commit on main.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the title against semantic-commit.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          if sh ./semantic-commit.sh "$RUNNER_TEMP/title.txt" > "$RUNNER_TEMP/out.txt" 2>&1; then
            echo "PR title matches the commit format."
          else
            echo "::warning title=PR title::The title does not match <type>(#<issue>): <subject> (see semantic-commit.sh). Report only, not blocking."
            cat "$RUNNER_TEMP/out.txt"
          fi
