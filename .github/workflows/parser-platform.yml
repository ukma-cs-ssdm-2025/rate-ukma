---
name: Parser Platform

on:
  pull_request:
    paths:
      - infra/deploy/parser/k8s/platform/**
      - .github/actions/k8s-tunnel/**
      - .github/workflows/parser-platform.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "Parser environment to update"
        required: true
        type: choice
        options:
          - staging
      action:
        description: "diff shows the changes - apply applies them"
        required: true
        type: choice
        default: diff
        options:
          - diff
          - apply

permissions:
  contents: read

env:
  # Keep within one minor version of the cluster (k3s v1.36 on staging).
  KUBECTL_VERSION: v1.36.5
  PLATFORM_ROOT: infra/deploy/parser/k8s/platform
  # Applied in this order: each one needs what the previous one installs.
  PLATFORM_DIRS: operators config database

jobs:
  render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Render kustomizations
        run: |
          for dir in $PLATFORM_DIRS; do
            kubectl kustomize "$PLATFORM_ROOT/$dir" > /dev/null
            echo "$dir renders"
          done

  platform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Cluster-admin access: the environment's required reviewer gates every run.
    environment: Parser ${{ inputs.environment == 'staging' && 'Staging' || 'Live' }}
    concurrency:
      group: parser-platform-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - uses: ./.github/actions/k8s-tunnel
        with:
          host: ${{ secrets.PARSER_SSH_HOST }}
          ssh_key: ${{ secrets.PARSER_SSH_KEY }}
          known_hosts: ${{ secrets.PARSER_SSH_KNOWN_HOSTS }}
          kubeconfig: ${{ secrets.PARSER_KUBECONFIG }}

      - name: Diff
        if: inputs.action == 'diff'
        # Adds pipefail, so a failed kubectl kustomize fails the preview.
        shell: bash
        run: |
          # Before the first apply, the operator namespaces and CRDs don't exist, so a server-side diff can't run.
          # Only NotFound counts as "not installed"; any other error fails the step.
          # No pipe here: without pipefail, a pipe would hide a kubectl error.
          installed=$(kubectl get namespace cert-manager cnpg-system --ignore-not-found -o name)
          if [ "$(grep -c . <<< "$installed")" -lt 2 ]; then
            echo "Operators are not installed yet. The first apply creates:"
            for dir in $PLATFORM_DIRS; do
              kubectl kustomize "$PLATFORM_ROOT/$dir" | grep '^kind:' | sort | uniq -c
            done
            exit 0
          fi

          # kubectl diff exits 1 when there are changes, and >1 on errors.
          for dir in $PLATFORM_DIRS; do
            kubectl diff --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/$dir" || [ $? -eq 1 ]
          done

      - name: Apply operators
        if: inputs.action == 'apply'
        run: |
          # Server-side apply: the CNPG CRDs are too large for the client-side last-applied annotation.
          kubectl apply --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/operators"

          # Wait for each rollout, not Available: during an upgrade the old pods keep Available=True.
          for ns in cert-manager cnpg-system; do
            # Assigned first, so a kubectl error fails the step instead of skipping the loop.
            deployments=$(kubectl -n "$ns" get deployment -o name)
            [ -n "$deployments" ] || { echo "::error::no Deployments in $ns"; exit 1; }
            for deployment in $deployments; do
              kubectl -n "$ns" rollout status "$deployment" --timeout=5m
            done
          done

      - name: Apply config
        if: inputs.action == 'apply'
        run: |
          # The cert-manager webhook can reject requests for a few seconds after its rollout finishes.
          for attempt in 1 2 3 4 5; do
            kubectl apply --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/config" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep 10
          done
          kubectl wait --for=condition=Ready clusterissuer --all --timeout=3m

      - name: Apply database
        if: inputs.action == 'apply'
        run: |
          before=$(kubectl -n parser get cluster parser-db --ignore-not-found -o jsonpath='{.metadata.generation}')
          kubectl apply --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/database"
          after=$(kubectl -n parser get cluster parser-db -o jsonpath='{.metadata.generation}')

          # CNPG reports no observedGeneration, so after a spec change Ready=True may still describe the old spec.
          # Wait for the operator to pick the change up first; some changes need no restart and never drop Ready.
          if [ -n "$before" ] && [ "$before" != "$after" ]; then
            kubectl -n parser wait --for=condition=Ready=false cluster/parser-db --timeout=30s 2> /dev/null \
              || echo "Ready stayed True: this change needed no restart."
          fi

          # The first start pulls the image and runs initdb, so allow several minutes.
          kubectl -n parser wait --for=condition=Ready cluster/parser-db --timeout=10m

          # The service reads DATABASE_URL from this Secret.
          kubectl -n parser get secret parser-db-app -o jsonpath='{.data.uri}' | grep -q . \
            || { echo "::error::parser-db-app has no uri key"; exit 1; }

      - name: Status
        if: always() && inputs.action == 'apply'
        run: |
          {
            echo "### Platform (${{ inputs.environment }})"
            echo '```'
            kubectl get pods -n cert-manager
            kubectl get pods -n cnpg-system
            kubectl get clusterissuers
            kubectl -n parser get cluster,pods,pvc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
