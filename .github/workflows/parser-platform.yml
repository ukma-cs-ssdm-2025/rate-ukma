---
name: Parser Platform

on:
  pull_request:
    paths:
      - infra/deploy/parser/k8s/platform/**
      - .github/actions/k8s-tunnel/**
      - .github/workflows/parser-platform.yml
  workflow_dispatch:
    inputs:
      action:
        description: "diff shows the changes - apply applies them"
        required: true
        type: choice
        default: diff
        options:
          - diff
          - apply

permissions:
  contents: read

# One dispatch run at a time, so nothing changes the cluster between diff and apply.
# Pull requests get their own group, so rendering is never queued behind an approval.
concurrency:
  group: parser-platform-${{ github.event_name == 'workflow_dispatch' && 'cluster' || github.ref }}
  cancel-in-progress: false

env:
  # Keep within one minor version of the cluster (k3s v1.36).
  KUBECTL_VERSION: v1.36.5
  PLATFORM_ROOT: infra/deploy/parser/k8s/platform
  # Applied in this order: each one needs what the previous one installs.
  PLATFORM_DIRS: operators config database monitoring

jobs:
  render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Render kustomizations
        run: |
          for dir in $PLATFORM_DIRS; do
            kubectl kustomize "$PLATFORM_ROOT/$dir" > /dev/null
            echo "$dir renders"
          done

  diff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The diff needs no approval, the apply job below does
    # ! This job still uses the admin kubeconfig, so anyone who can run it has full access to the live cluster
    # Parser Plan only allows runs from main
    environment: Parser Plan
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - uses: ./.github/actions/k8s-tunnel
        with:
          host: ${{ secrets.PARSER_SSH_HOST }}
          ssh_key: ${{ secrets.PARSER_SSH_KEY }}
          known_hosts: ${{ secrets.PARSER_SSH_KNOWN_HOSTS }}
          kubeconfig: ${{ secrets.PARSER_KUBECONFIG }}

      - name: Diff
        run: bash scripts/ci/parser-platform-diff.sh

  apply:
    needs: diff
    # Runs even with no changes, so the readiness checks repeat after an apply that failed on a wait.
    if: inputs.action == 'apply'
    runs-on: ubuntu-24.04
    # Cluster-admin with a required reviewer: approve after reading the diff in the run summary.
    environment: Parser
    steps:
      # Same run, the same commit and manifests as the diff.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - uses: ./.github/actions/k8s-tunnel
        with:
          host: ${{ secrets.PARSER_SSH_HOST }}
          ssh_key: ${{ secrets.PARSER_SSH_KEY }}
          known_hosts: ${{ secrets.PARSER_SSH_KNOWN_HOSTS }}
          kubeconfig: ${{ secrets.PARSER_KUBECONFIG }}

      - name: Apply operators
        run: |
          # Server-side apply: the CNPG CRDs are too large for the client-side last-applied annotation.
          kubectl apply --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/operators"

          # Wait for each rollout, not Available: during an upgrade the old pods keep Available=True.
          for ns in cert-manager cnpg-system; do
            # Assigned first, so a kubectl error fails the step instead of skipping the loop.
            deployments=$(kubectl -n "$ns" get deployment -o name)
            [ -n "$deployments" ] || { echo "::error::no Deployments in $ns"; exit 1; }
            for deployment in $deployments; do
              kubectl -n "$ns" rollout status "$deployment" --timeout=5m
            done
          done

      - name: Apply config
        run: |
          # The cert-manager webhook can reject requests for a few seconds after its rollout finishes.
          for attempt in 1 2 3 4 5; do
            kubectl apply --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/config" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep 10
          done
          kubectl wait --for=condition=Ready clusterissuer --all --timeout=3m

      # The parser image is private: the app pods pull it with this Secret.
      - name: Apply pull secret
        env:
          GHCR_PULL_USER: ${{ secrets.PARSER_GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.PARSER_GHCR_PULL_TOKEN }}
        run: |
          bash scripts/ci/parser-platform-pull-secret.sh \
            | kubectl apply --server-side --field-manager=parser-platform -f -

      # The worker signs in to САЗ with this account.
      - name: Apply САЗ secret
        env:
          SAZ_EMAIL: ${{ secrets.PARSER_CORPORATE_EMAIL }}
          SAZ_PASSWORD: ${{ secrets.PARSER_CORPORATE_PASSWORD }}
        run: |
          bash scripts/ci/parser-platform-saz-secret.sh \
            | kubectl apply --server-side --field-manager=parser-platform -f -

      - name: Apply database
        run: bash scripts/ci/parser-platform-apply-database.sh

      # Alloy pushes logs and metrics to Grafana Cloud with these credentials.
      # The monitoring namespace comes from config/, applied above.
      - name: Apply Grafana Cloud secret
        env:
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          GRAFANA_PROM_URL: ${{ secrets.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER: ${{ secrets.GRAFANA_PROM_USER }}
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER: ${{ secrets.GRAFANA_LOKI_USER }}
        run: |
          bash scripts/ci/parser-platform-grafana-secret.sh \
            | kubectl apply --server-side --field-manager=parser-platform -f -

      - name: Apply monitoring
        run: |
          kubectl apply --server-side --field-manager=parser-platform -k "$PLATFORM_ROOT/monitoring"

          # Alloy reads the Secret only when it starts, so it must restart when the token changes.
          # We store a hash of the Secret on the pod: a new hash restarts Alloy, the same hash does nothing.
          # The hash stays on the cluster, so a re-run after a failed deploy still restarts Alloy.
          hash=$(kubectl -n monitoring get secret grafana-cloud -o jsonpath='{.data}' | sha256sum | cut -c1-16)
          kubectl -n monitoring patch deployment alloy --type merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rateukma.com/grafana-secret-hash\":\"$hash\"}}}}}"

          kubectl -n monitoring rollout status deployment/alloy --timeout=3m

      - name: Status
        if: always()
        run: |
          {
            echo "### Platform"
            echo '```'
            kubectl get pods -n cert-manager
            kubectl get pods -n cnpg-system
            kubectl get clusterissuers
            kubectl -n parser get cluster,pods,pvc
            kubectl get pods -n monitoring
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
