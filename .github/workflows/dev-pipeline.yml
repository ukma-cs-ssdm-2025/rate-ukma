---
name: Dev Pipeline
# No paths filter: `ci-ok` must report on every PR, since the main ruleset
# requires it. Jobs still skip by area through changes-filter.
on:
  pull_request:

jobs:
  changes-filter:
    uses: ./.github/workflows/changes-filter.yml
    with:
      base: ${{ github.event.before }}
      ref: ${{ github.sha }}

  test:
    needs: changes-filter
    uses: ./.github/workflows/test.yml
    with:
      backend_changed: ${{ fromJSON(needs.changes-filter.outputs.backend_changed) || fromJSON(needs.changes-filter.outputs.ci_changed) }}
      webapp_changed: ${{ fromJSON(needs.changes-filter.outputs.webapp_changed) || fromJSON(needs.changes-filter.outputs.ci_changed) }}
      parser_changed: ${{ fromJSON(needs.changes-filter.outputs.parser_changed) || fromJSON(needs.changes-filter.outputs.ci_changed) }}

  openapi-validation:
    needs: changes-filter
    with:
      api_changed: >-
        ${{ fromJSON(needs.changes-filter.outputs.backend_changed) ||
        fromJSON(needs.changes-filter.outputs.openapi_changed) }}
    uses: ./.github/workflows/openapi-validation.yml

  audit:
    needs: changes-filter
    uses: ./.github/workflows/audit.yml
    secrets: inherit
    with:
      run_backend_audit: ${{ fromJSON(needs.changes-filter.outputs.backend_changed) }}
      run_frontend_audit: ${{ fromJSON(needs.changes-filter.outputs.webapp_changed) }}

  build:
    needs: changes-filter
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      backend_changed: ${{ fromJSON(needs.changes-filter.outputs.backend_changed) }}
      webapp_changed: ${{ fromJSON(needs.changes-filter.outputs.webapp_changed) }}
      parser_changed: ${{ fromJSON(needs.changes-filter.outputs.parser_changed) }}

  ci-ok:
    if: always()
    needs: [changes-filter, test, openapi-validation, audit, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
