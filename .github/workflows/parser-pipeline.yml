---
name: Parser Pipeline

# Tests, builds and deploys UKMA Data when a push to main changes the parser or its k8s manifests.
on:
  push:
    branches:
      - main
    paths:
      - src/parser/**
      - infra/deploy/parser/k8s/app/**
      - .github/workflows/parser-pipeline.yml

permissions:
  contents: read

# Runs go one at a time, in the order they were pushed.
# If several pushes are waiting, only the newest one runs, so an older commit never replaces a newer one on live.
# ! A running deploy is never cancelled, because it may be in the middle of a database migration.
concurrency:
  group: parser-pipeline
  cancel-in-progress: false

jobs:
  # The parser has its own versions (parser-vX.Y.Z), separate from the web app's.
  # Only commits that touch the parser count towards them.
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: write
    with:
      tag_prefix: parser-v
      change_path: src/parser infra/deploy/parser/k8s/app
      code_changed: true

  # The same parser checks as test.yml, copied here for two reasons:
  # test.yml tests the latest main rather than this commit,
  # and its backend job needs write permissions this workflow doesn't have.
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: src/parser

      - name: Run lint, format, typecheck and tests
        working-directory: src/parser
        run: pnpm check:all

      - name: Lint the generated OpenAPI file
        run: npx --yes @redocly/cli@2.57.0 lint docs/parser-service/openapi.json

  # Picks the image tag: normally the new version.
  # On a re-run, the version was already tagged on this commit the first time, so it is reused:
  # the re-run finishes that version's image and release instead of leaving them missing.
  # A push that only changes this workflow gets no version, so its image is tagged with the commit SHA instead.
  # Reusing the old version's tag would overwrite the image that version was released with.
  image:
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.version.outputs.version_tag }}
          VERSION_TYPE: ${{ needs.version.outputs.version_type }}
        run: |
          if [ "$VERSION_TYPE" != none ] && [ -n "$VERSION_TAG" ]; then
            version=$VERSION_TAG
          else
            # version.yml creates lightweight tags, so a tag's object is the commit itself.
            version=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/parser-v" \
              --jq ".[] | select(.object.sha == \"$GITHUB_SHA\") | .ref | ltrimstr(\"refs/tags/\")" | sort -V | tail -n 1)
          fi
          tag=${version:-$GITHUB_SHA}
          echo "Parser image tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Every run builds its own image, even when only the k8s manifests changed.
  build:
    needs: [test, image]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      version_tag: ${{ needs.image.outputs.tag }}
      backend_changed: false
      webapp_changed: false
      parser_changed: true

  # Skips the deploy when main already has a newer parser commit, for example when someone re-runs an old run.
  # Only parser commits count, so web-only pushes never block it. The newer commit's own run deploys instead.
  # To put an older version on live on purpose, dispatch Deploy Parser.
  newest:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: check
        run: |
          newest=$(git log -1 --format=%H -- src/parser infra/deploy/parser/k8s/app .github/workflows/parser-pipeline.yml)
          if [ "$newest" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$newest"; then
            echo "::notice::Not deploying $GITHUB_SHA: main has a newer parser commit, $newest."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [newest, image]
    if: needs.newest.outputs.deploy == 'true'
    uses: ./.github/workflows/parser-deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      version_tag: ${{ needs.image.outputs.tag }}
    secrets: inherit

  # Full release, not a pre-release - no staging step to wait for.
  # Not marked "Latest", label stays with the web app's release.
  release:
    needs: [image, deploy]
    if: needs.image.outputs.version != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version_tag: ${{ needs.image.outputs.version }}
      tag_prefix: parser-v
      change_path: src/parser infra/deploy/parser/k8s/app
      make_latest: "false"
