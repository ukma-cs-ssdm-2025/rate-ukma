---
# The identity Deploy Parser uses. It can roll out the app in the parser namespace only:
# no Secrets API, no RBAC, nothing cluster-wide.
# Not a Secret boundary: a pod it deploys can still mount any Secret in parser, such as parser-db-app.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parser-deployer
  namespace: parser
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: parser-deployer
  namespace: parser
rules:
  # kubectl apply (get, create, patch) and rollout status (watch).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch"]
  # The migrate Job can't be updated: the deploy deletes it and creates a new one.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Logs and events, to show why a migration or rollout failed.
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: parser-deployer
  namespace: parser
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: parser-deployer
subjects:
  - kind: ServiceAccount
    name: parser-deployer
    namespace: parser
---
# A long-lived token for the PARSER_DEPLOY_KUBECONFIG secret; the README shows how to build it.
# Deleting this Secret revokes the token, and the next Parser Platform apply creates a new one.
apiVersion: v1
kind: Secret
metadata:
  name: parser-deployer-token
  namespace: parser
  annotations:
    kubernetes.io/service-account.name: parser-deployer
type: kubernetes.io/service-account-token
