---
apiVersion: v1
kind: Namespace
metadata:
  name: parser
  labels:
    # Blocks privileged pods now.
    # Reports pods that would fail "restricted", so it can be enforced later.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Alloy mounts /proc, /sys and / read-only from the node for node metrics,
    # and baseline forbids hostPath volumes.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
