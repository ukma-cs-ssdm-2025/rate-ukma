---
# Upstream operator manifests, pinned to exact releases.
# Bump a version here, then run Parser Platform with action: diff before apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # cert-manager v1.21 supports Kubernetes 1.33-1.36.
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
  # CloudNativePG v1.30 supports Kubernetes 1.34-1.36.
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
