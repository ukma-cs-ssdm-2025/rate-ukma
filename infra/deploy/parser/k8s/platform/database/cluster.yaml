---
# Postgres for the parser service, run by CloudNativePG.
# CNPG creates the parser-db-app Secret;
# its uri key becomes the service's DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: parser-db
  namespace: parser
spec:
  # A primary and a streaming standby. When the primary fails, CNPG promotes the standby
  # and points parser-db-rw at it. Both run on the one node, so this covers pod failures only.
  # Replication is asynchronous: a failover can lose the last commits not yet streamed.
  instances: 2
  # An update restarts the standby first, then switches over to it, instead of restarting the primary.
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie

  # Crawl health as metrics (cnpg_parser_*), from queries.yaml. Alloy scrapes them on :9187.
  monitoring:
    customQueriesConfigMap:
      - name: parser-db-monitoring
        key: queries.yaml

  bootstrap:
    initdb:
      database: parser
      owner: parser

  storage:
    # k3s local-path: a directory on the node. It does not enforce the size.
    storageClass: local-path
    size: 5Gi

  # Sized for the 4 GB staging node: two instances take 1 GiB.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi

  postgresql:
    parameters:
      shared_buffers: 128MB
      # The standby's replication slot keeps WAL on the primary while the standby is down.
      # local-path enforces no size, so without a cap that WAL could fill the node's disk.
      max_slot_wal_keep_size: 2GB
