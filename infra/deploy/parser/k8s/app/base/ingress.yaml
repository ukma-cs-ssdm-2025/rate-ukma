---
# The overlay sets the host. cert-manager issues the certificate through the HTTP-01 challenge.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser-api
  labels:
    app.kubernetes.io/component: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - HOST
      secretName: parser-api-tls
  rules:
    - host: HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parser-api
                port:
                  name: http
