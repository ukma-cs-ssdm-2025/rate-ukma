---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: parser-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: data.staging.rateukma.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: data.staging.rateukma.com
