    get:
      operationId: ukma_data_sync_pending_list
      description: 'Proposed changes of each source''s current (latest succeeded)
        run or of a pinned `run`, rated rows first. Supports the review facets: `match`,
        `similar_existing`, a `field` or `fields_subset`, a title or САЗ `q`, and
