components:
  schemas:
    AccentEnum:
      enum:
      - BRAND
      - INFO
      - WARNING
      type: string
      description: |-
        * `BRAND` - Brand
        * `INFO` - Info
        * `WARNING` - Warning
    ActionEnum:
      enum:
      - apply
      - reject
      - revert
      - preview
      type: string
      description: |-
        * `apply` - Apply
        * `reject` - Reject
        * `revert` - Revert
        * `preview` - Preview
    AnswerEnum:
      enum:
      - keep_apart
      - merge
      - keep
      - move
      - place
      - relink
      type: string
      description: |-
        * `keep_apart` - Keep apart
        * `merge` - Merge
        * `keep` - Keep
        * `move` - Move
        * `place` - Place
        * `relink` - Relink
    CSRFToken:
      type: object
      properties:
        csrf_token:
          type: string
          maxLength: 64
      required:
      - csrf_token
    CommentAuthor:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
          nullable: true
        user_avatar_url:
          type: string
          readOnly: true
          nullable: true
        is_anonymous:
          type: boolean
          readOnly: true
      required:
      - is_anonymous
      - user_avatar_url
      - user_id
      - user_name
    CommentCreateRequest:
      properties:
        parent_comment:
          default: null
          format: uuid
          nullable: true
          title: Parent Comment
          type: string
        content:
          minLength: 1
          title: Content
          type: string
        is_anonymous:
          title: Is Anonymous
          type: boolean
      required:
      - content
      - is_anonymous
      title: CommentCreateRequest
      type: object
    CommentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentRead'
        filters:
          type: object
          additionalProperties: {}
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        next_page:
          type: integer
          minimum: 1
          nullable: true
        previous_page:
          type: integer
          minimum: 1
          nullable: true
      required:
      - filters
      - items
      - next_page
      - page
      - page_size
      - previous_page
      - total
      - total_pages
    CommentPutParams:
      properties:
        content:
          minLength: 1
          title: Content
          type: string
        is_anonymous:
          title: Is Anonymous
          type: boolean
      required:
      - content
      - is_anonymous
      title: CommentPutParams
      type: object
    CommentRead:
      type: object
      description: Serializer for reading CommentDto. Nulls identity fields for anonymous
        comment.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        parent_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        rating_id:
          type: string
          format: uuid
          readOnly: true
        content:
          type: string
          readOnly: true
        user_id:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
          nullable: true
        user_avatar_url:
          type: string
          readOnly: true
          nullable: true
        is_anonymous:
          type: boolean
          readOnly: true
        can_manage:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        replies_count:
          type: integer
          readOnly: true
      required:
      - can_manage
      - content
      - created_at
      - id
      - is_anonymous
      - parent_id
      - rating_id
      - replies_count
      - user_avatar_url
      - user_id
      - user_name
    ControlEnum:
      enum:
      - pass_fail
      - exam
      - thesis
      - none
      - thesis_defence
      type: string
      description: |-
        * `pass_fail` - pass_fail
        * `exam` - exam
        * `thesis` - thesis
        * `none` - none
        * `thesis_defence` - thesis_defence
    CourseAnalytics:
      type: object
      description: Serializer for course analytics
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          maxLength: 255
        avg_usefulness:
          type: number
          format: double
          readOnly: true
          nullable: true
        avg_difficulty:
          type: number
          format: double
          readOnly: true
          nullable: true
        ratings_count:
          type: integer
          readOnly: true
          default: 0
        faculty_name:
          type: string
          readOnly: true
      required:
      - avg_difficulty
      - avg_usefulness
      - faculty_name
      - id
      - name
      - ratings_count
    CourseDetail:
      type: object
      description: Read-only serializer for course details
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
          maxLength: 255
        description:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        education_level:
          allOf:
          - $ref: '#/components/schemas/EducationLevelEnum'
          readOnly: true
          nullable: true
        department:
          type: string
          format: uuid
          readOnly: true
        department_name:
          type: string
          readOnly: true
        faculty:
          type: string
          format: uuid
          readOnly: true
        faculty_name:
          type: string
          readOnly: true
        faculty_custom_abbreviation:
          type: string
          readOnly: true
          nullable: true
          maxLength: 255
        specialities:
          type: array
          items:
            $ref: '#/components/schemas/CourseOfferingSpecialityInline'
          readOnly: true
        avg_difficulty:
          type: number
          format: double
          readOnly: true
          nullable: true
        avg_usefulness:
          type: number
          format: double
          readOnly: true
          nullable: true
        ratings_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - avg_difficulty
      - avg_usefulness
      - department
      - department_name
      - description
      - education_level
      - faculty
      - faculty_custom_abbreviation
      - faculty_name
      - id
      - ratings_count
      - specialities
      - status
      - title
    CourseInstructorList:
      type: object
      description: Schema for GET /api/v1/courses/{course_id}/instructors/.
      properties:
