  /api/v1/ukma-data/sync/apply/:
    post:
      operationId: ukma_data_sync_apply
      description: 'Apply at most 5 000 changes of the previewed selection, lowest
        change numbers first, in one transaction. The 40 s budget starts once the
        selection is read and is checked between batches and before the decision is
        saved; past it the request rolls back and answers 422 `deadline_exceeded`.
        One SQL statement may run at most 30 s, so a batch started near the end can
        finish after 40 s. The `token` from `preview` binds the selected change ids:
        if that id set changed, the answer is 409 `selection_changed`. A change in
        the set that another decision took since the preview is not applied and is
        counted as skipped, so `counts` can differ from the preview. A retry with
        the same `client_key` returns the first decision with 200 instead of applying
        twice; each new attempt needs a new `client_key`. Superusers only.'
      summary: Apply a previewed sync selection
      tags:
      - ukma-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncApplyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncApplyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncApplyRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDecisionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    detail: Validation failed
                    status: 400
                    fields:
                      difficulty:
                      - Must be between 1 and 5.
                  summary: Validation error
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                Unauthorized:
                  value:
                    detail: Authentication credentials were not provided
                    status: 401
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action
                    status: 403
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NotFound:
                  value:
                    detail: Not found
                    status: 404
                  summary: Not found
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRefusal'
          description: 'Refused: nothing written'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRefusal'
          description: Nothing to apply or preview
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRefusal'
          description: Apply failed
