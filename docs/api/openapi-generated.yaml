      summary: Partially update a comment
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        description: Unique identifier of a comment
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentPatchParams'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentPatchParams'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentPatchParams'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentRead'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    detail: Validation failed
                    status: 400
                    fields:
