openapi: 3.0.3
info:
  title: Rate UKMA API
  version: 1.0.0
  description: An API for rating UKMA courses and professors
paths:
  /api/v1/analytics/:
    get:
      operationId: analytics_list
      description: |-
        Get courses analytics with optional filters.
        Returns courses analytics with aggregated ratings.
      summary: Get courses analytics
      parameters:
      - in: query
        name: avg_difficulty_max
        schema:
          type: number
          format: float
        description: Maximum average difficulty (1.0 - 5.0)
      - in: query
        name: avg_difficulty_min
        schema:
          type: number
          format: float
        description: Minimum average difficulty (1.0 - 5.0)
      - in: query
        name: avg_difficulty_order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort order for difficulty (asc/desc)
      - in: query
        name: avg_usefulness_max
        schema:
          type: number
          format: float
        description: Maximum average usefulness (1.0 - 5.0)
      - in: query
        name: avg_usefulness_min
        schema:
          type: number
          format: float
        description: Minimum average usefulness (1.0 - 5.0)
      - in: query
        name: avg_usefulness_order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort order for usefulness (asc/desc)
      - in: query
        name: credits_max
        schema:
          type: number
          format: float
        description: Maximum ECTS credits for course offering (requires semester_year)
      - in: query
        name: credits_min
        schema:
          type: number
          format: float
        description: Minimum ECTS credits for course offering (requires semester_year)
      - in: query
        name: department
        schema:
          type: string
          format: uuid
        description: Filter by department UUID
      - in: query
        name: education_level
        schema:
          type: string
          enum:
          - BACHELOR
          - MASTER
        description: Filter by education level (BACHELOR, MASTER)
      - in: query
        name: faculty
        schema:
          type: string
          format: uuid
        description: Filter by faculty UUID
      - in: query
        name: instructor
        schema:
          type: string
          format: uuid
        description: Filter by instructor UUID
      - in: query
        name: last_review_order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort order for most recent review timestamp (asc/desc); courses
          without reviews appear last in both directions
      - in: query
        name: name
        schema:
          type: string
        description: Filter by course name
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page
      - in: query
        name: ratings_count_min
        schema:
          type: integer
        description: Minimum ratings count (0+)
      - in: query
        name: semester_terms
        schema:
          type: array
          items:
            type: string
            enum:
            - FALL
            - SPRING
            - SUMMER
        description: Semester terms to filter by (FALL, SPRING, SUMMER)
      - in: query
        name: semester_year
        schema:
          type: string
        description: Academic year range (e.g., '2024–2025')
      - in: query
        name: speciality
        schema:
          type: string
          format: uuid
        description: Filter by speciality UUID
      - in: query
        name: type_kind
        schema:
          type: string
          enum:
          - COMPULSORY
          - ELECTIVE
          - PROF_ORIENTED
        description: Course type kind (COMPULSORY, ELECTIVE, PROF_ORIENTED)
      tags:
      - analytics
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseAnalytics'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    detail: Validation failed
                    status: 400
                    fields:
                      difficulty:
                      - Must be between 1 and 5.
                  summary: Validation error
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                Unauthorized:
                  value:
                    detail: Authentication credentials were not provided
                    status: 401
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action
                    status: 403
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NotFound:
                  value:
                    detail: Not found
                    status: 404
                  summary: Not found
          description: Not found
  /api/v1/analytics/{course_id}/:
    get:
      operationId: analytics_retrieve
