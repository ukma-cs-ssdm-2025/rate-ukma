      description: Mark the selected proposed changes of one run rejected and supersede
        the changes waiting on them; nothing on the site changes. A rejected change
        comes back after the next read if САЗ still differs. A retry with the same
        `client_key` returns the first decision with 200; each new attempt needs a
        new `client_key`. Superusers only.
