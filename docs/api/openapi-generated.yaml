          type: string
        description: Change rows that touch this field
      - in: query
        name: fields_subset
        schema:
          type: string
        description: Comma-separated fields the change must stay within
      - in: query
        name: group
        schema:
          type: string
          enum:
          - change
          - link
          - mapping
          - new
          - other
          - removed
        description: Only changes of this group, or `other` for the kinds no group
          line shows; omit for every group
      - in: query
        name: kind
        schema:
          type: string
        description: Only changes of this kind from the registry
      - in: query
        name: match
        schema:
          type: string
          enum:
          - exact
          - review
        description: 'Link strength: exact (code or same title) or review'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-based)
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page
      - in: query
        name: q
        schema:
          type: string
        description: Match a title or a САЗ code
      - in: query
        name: rated
        schema:
          type: boolean
        description: Only rows with ratings (`true`) or without (`false`)
      - in: query
        name: run
        schema:
          type: integer
        description: Pin one run; omit for each source's current run
      - in: query
        name: seed
        schema:
          type: integer
        description: Sample order seed
      - in: query
        name: similar_existing
        schema:
          type: boolean
        description: New courses whose normalised title already exists
      - in: query
        name: source
        schema:
          type: string
          enum:
          - catalog
          - teachers
        description: Only changes of this source; omit for both
      - in: query
        name: state
        schema:
          type: string
          enum:
