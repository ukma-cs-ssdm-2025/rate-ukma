<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="A Deployment creates a ReplicaSet, and the ReplicaSet creates pods">
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:20px;fill:#111318}
.mu{fill:#5c6470;font-size:17px}.c{text-anchor:middle}.ac{fill:#0074a3;font-weight:650}.wh{fill:#fff}
.bd{fill:#fff;stroke:#c9ced4;stroke-width:1.5}.bd.ac{fill:#fff;stroke:#0074a3;stroke-width:2}.bd.now{fill:#0074a3;stroke:#0074a3}
.bd.new{fill:#fff;stroke:#9aa3ad;stroke-width:1.5;stroke-dasharray:6 5}.bd.soft{fill:#f3f7fa;stroke:none}
.ln{stroke:#9aa3ad;stroke-width:1.5;fill:none}.ln.ac{stroke:#0074a3;stroke-width:2}.ln.dash{stroke-dasharray:5 5}
.hd{fill:#9aa3ad}.hd.ac{fill:#0074a3}
</style>
<defs><marker id="m6" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 z" class="hd ac"/></marker></defs>
<rect class="bd now" x="0" y="15" width="280" height="100" rx="12"/>
<text class="c wh" x="140" y="56">Deployment</text>
<text class="c wh" x="140" y="86" style="font-size:17px">image, number of copies</text>
<path class="ln ac" d="M280 65 H356" marker-end="url(#m6)"/>
<rect class="bd" x="360" y="15" width="280" height="100" rx="12"/>
<text class="c" x="500" y="56">ReplicaSet</text>
<text class="c mu" x="500" y="86">keeps N pods</text>
<path class="ln ac" d="M640 65 H716" marker-end="url(#m6)"/>
<rect class="bd" x="720" y="15" width="280" height="100" rx="12"/>
<text class="c" x="860" y="56">Pod</text>
<text class="c mu" x="860" y="86">a running image</text>
</svg>
