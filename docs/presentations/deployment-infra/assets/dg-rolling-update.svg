<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Three steps of a rolling update">
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:20px;fill:#111318}
.mu{fill:#5c6470;font-size:17px}.c{text-anchor:middle}.ac{fill:#0074a3;font-weight:650}.wh{fill:#fff}
.bd{fill:#fff;stroke:#c9ced4;stroke-width:1.5}.bd.ac{fill:#fff;stroke:#0074a3;stroke-width:2}.bd.now{fill:#0074a3;stroke:#0074a3}
.bd.new{fill:#fff;stroke:#9aa3ad;stroke-width:1.5;stroke-dasharray:6 5}.bd.soft{fill:#f3f7fa;stroke:none}
.ln{stroke:#9aa3ad;stroke-width:1.5;fill:none}.ln.ac{stroke:#0074a3;stroke-width:2}.ln.dash{stroke-dasharray:5 5}
.hd{fill:#9aa3ad}.hd.ac{fill:#0074a3}
</style>
<text class="mu" x="0" y="20">1. Old version runs</text>
<rect class="bd" x="0" y="36" width="130" height="100" rx="12"/>
<text class="c" x="65" y="94">v1</text>
<text class="mu" x="360" y="20">2. New version starts</text>
<rect class="bd" x="360" y="36" width="130" height="100" rx="12"/>
<text class="c" x="425" y="94">v1</text>
<rect class="bd new" x="510" y="36" width="130" height="100" rx="12"/>
<text class="c" x="575" y="94">v2</text>
<text class="mu" x="720" y="20">3. v2 ready, v1 removed</text>
<rect class="bd ac" x="720" y="36" width="130" height="100" rx="12"/>
<text class="c ac" x="785" y="94">v2</text>
</svg>
