<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="A request passes the firewall, Traefik, a Service and the API pod, and reaches Postgres">
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:20px;fill:#111318}
.mu{fill:#5c6470;font-size:17px}.c{text-anchor:middle}.ac{fill:#0074a3;font-weight:650}.wh{fill:#fff}
.bd{fill:#fff;stroke:#c9ced4;stroke-width:1.5}.bd.ac{fill:#fff;stroke:#0074a3;stroke-width:2}.bd.now{fill:#0074a3;stroke:#0074a3}
.bd.new{fill:#fff;stroke:#9aa3ad;stroke-width:1.5;stroke-dasharray:6 5}.bd.soft{fill:#f3f7fa;stroke:none}
.ln{stroke:#9aa3ad;stroke-width:1.5;fill:none}.ln.ac{stroke:#0074a3;stroke-width:2}.ln.dash{stroke-dasharray:5 5}
.hd{fill:#9aa3ad}.hd.ac{fill:#0074a3}
</style>
<defs><marker id="m17" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 z" class="hd ac"/></marker></defs>
<rect class="bd" x="0" y="20" width="160" height="90" rx="12"/>
<text class="c" x="80" y="60">Client</text>
<text class="c mu" x="80" y="88">HTTPS</text>
<path class="ln ac" d="M160 65 H226" marker-end="url(#m17)"/>
<rect class="bd soft" x="230" y="0" width="770" height="340" rx="12"/>
<text x="254" y="30" class="mu">Hetzner VM, open ports 22, 80, 443</text>
<rect class="bd now" x="254" y="45" width="210" height="84" rx="12"/>
<text class="c wh" x="359" y="82">Traefik</text>
<text class="c wh" x="359" y="110" style="font-size:17px">Ingress, TLS</text>
<path class="ln ac" d="M464 87 H510" marker-end="url(#m17)"/>
<rect class="bd" x="514" y="45" width="210" height="84" rx="12"/>
<text class="c" x="619" y="82">Service</text>
<text class="c mu" x="619" y="110">parser-api</text>
<path class="ln ac" d="M724 87 H766" marker-end="url(#m17)"/>
<rect class="bd" x="770" y="45" width="206" height="84" rx="12"/>
<text class="c" x="873" y="82">Pod</text>
<text class="c mu" x="873" y="110">parser-api</text>
<path class="ln ac" d="M873 129 V182" marker-end="url(#m17)"/>
<rect class="bd" x="770" y="186" width="206" height="84" rx="12"/>
<text class="c" x="873" y="223">Service</text>
<text class="c mu" x="873" y="251">parser-db-rw</text>
<path class="ln ac" d="M770 228 H728" marker-end="url(#m17)"/>
<rect class="bd" x="514" y="186" width="210" height="84" rx="12"/>
<text class="c" x="619" y="223">Postgres</text>
<text class="c mu" x="619" y="251">primary and standby</text>
<rect class="bd" x="254" y="186" width="210" height="84" rx="12"/>
<path class="ln ac" d="M464 228 H510" marker-end="url(#m17)"/>
<text class="c" x="359" y="223">Pod</text>
<text class="c mu" x="359" y="251">parser-worker</text>
<text class="mu" x="254" y="312">the worker writes to the same database and takes no outside requests</text>
</svg>
